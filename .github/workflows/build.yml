name: Build Kernel (No Module Sig)
on: workflow_dispatch

env:
  DEFCONFIG: k85v1_64_k419_defconfig

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libncurses-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            device-tree-compiler python3 cpio rsync kmod

      - name: Disable OPLUS features whose source was stripped from the release
        run: |
          FEATURES="
          OPLUS_FEATURE_SCHED_ASSIST
          OPLUS_FEATURE_PHOENIX
          OPLUS_FEATURE_HEALTHINFO
          OPLUS_FEATURE_TASK_CPUSTATS
          OPLUS_FEATURE_MM_FEEDBACK
          OPLUS_FEATURE_MULTI_FREEAREA
          "
          for feat in $FEATURES; do
            [ -z "$feat" ] && continue
            if grep -qE "^[ \t]*${feat}[ \t]*\\\\?[ \t]*$" OplusKernelEnvConfig.mk; then
              sed -i -E "/^[ \t]*${feat}[ \t]*\\\\?[ \t]*$/d" OplusKernelEnvConfig.mk
              echo "Removed feature define: $feat"
            else
              echo "NOTE: $feat not found as a standalone list entry"
            fi
          done

      - name: Fix broken comment-guard in meminfo.c (vendor typo, not our change)
        run: |
          sed -i -E 's|^//#ifdef OPLUS_FEATURE_HEALTHINFO$|#ifdef OPLUS_FEATURE_HEALTHINFO|' fs/proc/meminfo.c
          sed -i -E 's|^//#endif /\*OPLUS_FEATURE_HEALTHINFO\*/$|#endif /*OPLUS_FEATURE_HEALTHINFO*/|' fs/proc/meminfo.c
          echo "=== resulting context ==="
          sed -n '24,28p' fs/proc/meminfo.c

      - name: Add missing OPLUS_FEATURE_SCHED_ASSIST guards in sched/core.c
        run: |
          perl -0777 -i -pe '
            s/(if\s*\(p->ux_state\s*&\s*SA_TYPE_TURBO\s*&&\s*clamp_id\s*==\s*UCLAMP_MIN\s*&&\s*sysctl_set_ux_uclamp_enable\)\s*\{)/#ifdef OPLUS_FEATURE_SCHED_ASSIST\n$1/;
            s/(return\s*\(unsigned long\)uc_value;\s*\n\s*\})/$1\n#endif \/* OPLUS_FEATURE_SCHED_ASSIST *\//;
            s/(if\s*\(p->ux_state\s*&\s*SA_TYPE_TURBO\s*&&\s*clamp_id\s*==\s*UCLAMP_MIN\s*&&\s*sysctl_set_ux_uclamp_enable\)\s*\n\s*tmp_value\s*=\s*ux_uclamp_value;)/#ifdef OPLUS_FEATURE_SCHED_ASSIST\n$1\n#endif \/* OPLUS_FEATURE_SCHED_ASSIST *\//;
          ' kernel/sched/core.c
          echo "=== verify: should now show #ifdef/#endif around both blocks ==="
          grep -n "OPLUS_FEATURE_SCHED_ASSIST\|ux_state\|ux_uclamp_value" kernel/sched/core.c

      - name: Stub missing Kconfig + Makefile pairs (from Kconfig 'source' directives)
        run: |
          grep -rhoP '^[ \t]*source[ \t]+\K.*' --include=Kconfig . \
            | sed -e 's/^"//' -e 's/"$//' -e 's/[[:space:]]*$//' \
            | tr -d '\r' | sort -u > /tmp/all_sources.txt
          MISSING=0
          while IFS= read -r f; do
            f="$(printf '%s' "$f" | tr -d '\r')"
            [ -z "$f" ] && continue
            case "$f" in *'$('*) continue ;; esac
            if [ ! -f "$f" ]; then
              d="$(dirname "$f")"
              if { [ -e "$d" ] || [ -L "$d" ]; } && [ ! -d "$d" ]; then rm -f "$d"; fi
              mkdir -p "$d"
              echo "# stub: file absent from public source release" > "$f"
              [ -f "$d/Makefile" ] || echo "# stub: empty makefile" > "$d/Makefile"
              MISSING=$((MISSING+1))
            fi
          done < /tmp/all_sources.txt
          echo "Total stubbed via Kconfig scan: $MISSING"

      - name: Stub missing Makefiles (from obj-y/obj-m directory descent)
        run: |
          COUNT_FILE=/tmp/makefile_stub_count
          echo 0 > "$COUNT_FILE"
          find . -path ./out -prune -o -path ./.git -prune -o -name Makefile -print | while IFS= read -r mf; do
            mdir="$(dirname "$mf")"
            joined="$(sed ':a;N;$!ba;s/\\\n/ /g' "$mf" 2>/dev/null)"
            printf '%s\n' "$joined" | grep -oP '(?m)^[ \t]*obj-\S*[ \t]*[+:]?=[ \t]*\K.*' 2>/dev/null | while IFS= read -r rhs; do
              printf '%s\n' "$rhs" | grep -oE '[A-Za-z0-9_./-]+/' | while IFS= read -r tok; do
                case "$tok" in *'$('*) continue ;; esac
                target="${mdir#./}/${tok}"; target="${target%/}"
                if [ ! -f "$target/Makefile" ] && [ ! -f "$target/Kbuild" ]; then
                  if { [ -e "$target" ] || [ -L "$target" ]; } && [ ! -d "$target" ]; then rm -f "$target"; fi
                  mkdir -p "$target"
                  echo "# stub: empty makefile" > "$target/Makefile"
                  n=$(cat "$COUNT_FILE"); echo $((n+1)) > "$COUNT_FILE"
                fi
              done
            done
          done
          echo "Total stubbed via Makefile scan: $(cat "$COUNT_FILE")"

      - name: Force-stub known holdouts as a safety net
        run: |
          for d in block/uxio_first arch/arm64/kernel/rootguard kernel/keventupload; do
            if { [ -e "$d" ] || [ -L "$d" ]; } && [ ! -d "$d" ]; then rm -f "$d"; fi
            mkdir -p "$d"
            [ -f "$d/Kconfig" ] || echo "# stub" > "$d/Kconfig"
            [ -f "$d/Makefile" ] || echo "# stub" > "$d/Makefile"
          done

      - name: Generate base config
        run: make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- ${DEFCONFIG} 2>&1 | tail -5

      - name: Disable module signature enforcement
        run: |
          ./scripts/config --file out/.config \
            -d MODULE_SIG -d MODULE_SIG_FORCE -d MODULE_SIG_ALL -d MODULE_SIG_SHA512
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig 2>&1 | tail -5

      - name: Confirm signature configs are off
        run: grep -E "^CONFIG_MODULE_SIG|^# CONFIG_MODULE_SIG" out/.config || true

      - name: Build kernel + modules
        run: |
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            -j$(nproc) Image.gz modules 2>&1 | tee build.log

      - name: Show failure summary
        if: failure()
        run: |
          grep -iE "fatal error|no such file|undefined reference|error:" build.log | tail -50 || true

      - name: Collect output
        if: always()
        run: |
          mkdir -p artifact
          cp out/arch/arm64/boot/Image.gz artifact/ 2>/dev/null || echo "Image.gz not found"
          find out -name "*.ko" -exec cp {} artifact/ \; 2>/dev/null || true
          cp build.log artifact/ 2>/dev/null || true
          ls -la artifact/

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k85v1_64_k419-nosig-kernel
          path: artifact/
          retention-days: 14
